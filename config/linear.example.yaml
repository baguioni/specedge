version: 1
opt: 2
base:
  result_path: "result/linear"
  exp_name: "specedge_linear"
  dtype: fp32
  seed: 42
  ssh_key: ~/.ssh/id_ed25519_server
  max_len: 2048
server:
  process_name: server
  target_model: Qwen/Qwen3-4B
  device: cuda:0
  temperature: 0.0
  max_batch_size: 1
  num_clients: 1
  batch_type: static
  cache_prefill: true
client:
  host: 127.0.0.1:8000
  process_name: client
  draft_model: Qwen/Qwen3-0.6B
  dataset: mtbench
  reasoning: False
  sample_req_cnt: 1
  req_offset: 0
  max_n_beams: 1
  max_beam_len: 16
  max_branch_width: 1
  max_budget: 16
  proactive:
    type: disabled
    # Linear drafting has one tree leaf, so proactive draft generation is a
    # no-op here. Saguaro instead hedges across accept depths -- set
    # `strategy: saguaro` (and widen the params below) to enable it:
    #   strategy: saguaro
    strategy: disabled           # proactive | saguaro | disabled
    max_n_beams: 8               # widen for the saguaro fan-out forward
    max_beam_len: 1
    max_branch_width: 1          # linear continuations
    max_budget: 8
    saguaro:
      budget: 6
      branch_len: 4
      fan_out: geometric
      init_accept_rate: 0.5
      linear: auto               # -> True, since max_branch_width == 1
  max_new_tokens: 64
  max_request_num: -1
node:
  localhost:
  - device: cuda:0
