  batch_type: static
  num_clients: 1
  cache_prefill: true
client:
  host: mango1:8000
  draft_model: Qwen/Qwen3-0.6B
  dataset: specbench
  sample_req_cnt: 8
  req_offset: 0
  max_n_beams: 32
  max_budget: 64
