# script/sweep_experiments.py — client-side experiment sweep configuration
#
# Runs on the CLIENT box against a batch server that is already up and stays up
# for the whole sweep. For every experiment sweep_experiments.py:
#   1. renders a config = base_config <- common <- experiment.overrides, with
#      base.exp_name set to the experiment name, base.result_path forced from
#      paths.result_path, and client.host forced to `client.host` below;
#   2. writes the rendered config under paths.rendered_dir;
#   3. runs src/script/client_host.py --config <rendered> until it exits;
#   4. gathers result/<exp_name>/ into paths.collect_to/<exp_name>/ (and, if the
#      optional server.ssh is set, pulls the server-side server.* too).
#
# The server is never started or stopped here. Start it yourself once:
#   python -O src/script/batch_server.py --config <a rendered config>
# and shut it down when the sweep is done:
#   python src/script/stop_batch_server.py --host <ip_address:host_port>
#
# Then point the metric script at each collected folder:
#   python src/metric/specedge.py -d <paths.collect_to>/<exp_name>

# --------------------------------------------------------------------------- #
# Server address — the batch server as seen FROM this (client) box.
# Set it to the running server's "<ip_address>:<host_port>" (for VAST.ai that
# is <public_ip> : the host port mapped to the container's SPECEDGE_PORT).
# Can be overridden on the command line with:  --host <ip_address:host_port>
# --------------------------------------------------------------------------- #
# Identity file passed as `ssh -i` to both boxes.
ssh_identity: ~/.ssh/vast

server:
  ssh: "root@202.122.49.242 -p 17720"
  # Container port batch_server.py binds. It is hardcoded to 10100 (SPECEDGE_PORT
  # is exported but never read), so this is what vast_ports.sh --emit reports.
  port: 10100

client:
  ssh: "root@175.28.230.22 -p 50117"
  # <server public ip>:<host port VAST maps to container port 10100>
  host: "202.122.49.242:17498"

# script/sweep.py waits for this line in the server's stdout/log before it
# starts the client (logged at the end of SpecExecBatchServer init).
ready_marker: "Inference controller initialized"

paths:
  # Template on this machine; merged then overridden per experiment.
  base_config: config/specedge.example.yaml
  # Where rendered per-experiment configs are written (repo-relative).
  rendered_dir: config/_sweep
  # Forced into base.result_path of every rendered config (repo-relative).
  result_path: result/sweep
  # Directory to gather result/<exp_name>/ into (repo-relative).
  collect_to: result/sweep
  # Only used for the optional server-side result pull below: the repo checkout
  # path on the server box ("~" is expanded by the remote shell).
  remote_root: /workspace/specedge

timeouts:
  run: 5400            # s cap for one client_host.py run
  cooldown: 10         # s to pause between experiments
  server_ready: 900    # s to wait for ready_marker after launching the server
  server_shutdown: 120 # s to wait for the server to exit after clients finish

common:
  base:
    max_len: 2048
    seed: 42
    dtype: fp16
  server:
    target_model: Qwen/Qwen3-14B
    device: cuda:0
    temperature: 0.7
    max_batch_size: 1
    num_clients: 1
    batch_type: static
    cache_prefill: true
  client:
    draft_model: Qwen/Qwen3-1.7B
    dataset: specbench
    reasoning: false
    sample_req_cnt: 32
    req_offset: 0
    max_n_beams: 8
    max_beam_len: 6
    max_branch_width: 8
    max_budget: 32
    max_new_tokens: 64
    max_request_num: -1
  node:
    localhost:
      - device: cuda:0

# One entry per run. `name` -> base.exp_name and the result subfolder.
# `overrides` is a deep-merge patch applied last. Keep the patches to
# client-side knobs (client.proactive.*, client.draft_model, max_new_tokens,
# max_request_num) so the persistent server stays valid across the sweep.
experiments:
  - name: baseline
    overrides:
      client:
        proactive:
          type: excluded
          strategy: disabled

  - name: proactive
    overrides:
      client:
        proactive:
          type: included
          strategy: proactive
          max_n_beams: 8
          max_beam_len: 6
          max_branch_width: 8
          max_budget: 32

  - name: saguaro_geom
    overrides:
      client:
        proactive:
          type: included
          strategy: saguaro
          max_n_beams: 8
          max_branch_width: 8
          max_beam_len: 6
          max_budget: 32
          saguaro:
            budget: 8
            branch_len: 3
            fan_out: geometric
            acceptance_rate: 0.5
            exit_mode: leaf
            trace: false

  - name: saguaro_geom_linear
    overrides:
      client:
        proactive:
          type: included
          strategy: saguaro
          max_n_beams: 8
          max_branch_width: 8
          max_beam_len: 6
          max_budget: 32
          saguaro:
            budget: 8
            branch_len: 3
            fan_out: geometric
            acceptance_rate: 0.5
            exit_mode: trunk
            trace: false

  - name: saguaro_uniform
    overrides:
      client:
        proactive:
          type: included
          strategy: saguaro
          max_n_beams: 8
          max_branch_width: 8
          max_beam_len: 6
          max_budget: 32
          saguaro:
            budget: 8
            branch_len: 3
            fan_out: uniform
            exit_mode: leaf
            trace: false

  - name: saguaro_uniform_linear
    overrides:
      client:
        proactive:
          type: included
          strategy: saguaro
          max_n_beams: 8
          max_branch_width: 8
          max_beam_len: 6
          max_budget: 32
          saguaro:
            budget: 8
            branch_len: 3
            fan_out: uniform
            exit_mode: trunk
            trace: false
