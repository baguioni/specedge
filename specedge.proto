syntax = "proto3";

package specedge;

service SpecEdgeService {
    rpc Validate (ValidateRequest) returns (ValidateResponse) {}
    rpc Sync (SyncRequest) returns (SyncResponse) {}
    rpc Done (DoneRequest) returns (DoneResponse) {}
}

message ValidateRequest {
    int32 client_idx = 1;
    int32 req_idx = 2;
    bytes input_ids = 3;
    bytes position_ids = 4;
    bytes cache_seq_indices = 5;
    bytes parent_indices = 6;
    bytes attention_mask = 7;
    bool prefill = 8;
    optional string prefix = 9;
}

message ValidateResponse {
    bytes selection = 1;
    int32 prefill = 2;
}

message SyncRequest {
    // Clients sync at the start of every experiment. exp_name / result_path let
    // a persistent server re-point its result logger at the new run's folder
    // without a restart (see SpecExecBatchServer.Sync).
    int32 client_idx = 1;
    string exp_name = 2;
    string result_path = 3;
}
message SyncResponse { }

message DoneRequest {
    int32 client_idx = 1;
    // Set by an orchestrator (not a normal client) once the whole sweep is
    // done, to trip the server's graceful shutdown. A plain Done just marks
    // this client finished; the server then re-arms for the next experiment.
    bool shutdown = 2;
}
message DoneResponse { }
